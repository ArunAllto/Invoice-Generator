<ion-header>
  <ion-toolbar color="primary">
    <ion-title>More</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @for (group of groups; track group.heading) {
    <ion-list inset="true">
      <ion-list-header>{{ group.heading }}</ion-list-header>
      @for (entry of group.entries; track entry.route) {
        <ion-item
          button="true"
          [detail]="entry.built"
          [class.cd-unbuilt]="!entry.built"
          (click)="open(entry)"
        >
          <ion-label>
            <h3>{{ entry.title }}</h3>
            <p>{{ entry.subtitle }}</p>
          </ion-label>
          @if (!entry.built) {
            <ion-badge slot="end" color="medium">Soon</ion-badge>
          }
        </ion-item>
      }
    </ion-list>
  }

  <div class="cd-centre">
    <ion-note>
      Version 1.0.0
      @if (status().ready) {
        · database v{{ status().schemaVersion }}
      }
    </ion-note>
  </div>
</ion-content>
